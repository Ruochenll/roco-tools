<nav class="navbar">
    <div class="nav-inner">
        <a href="{% url 'home' %}" class="nav-brand">
            <span class="nav-logo" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2l2.4 6.2L21 9.3l-5 4.4 1.5 6.5L12 16.7 6.5 20.2 8 13.7 3 9.3l6.6-1.1L12 2z" fill="#FFFFFF"/>
                </svg>
            </span>
            <span class="brand-text">洛克王国工具箱</span>
        </a>
        <ul class="nav-links">
            <li><a href="{% url 'home' %}" class="{% if request.path == '/' %}active{% endif %}">首页</a></li>
            <li><a href="/pvp/battle-calc/" class="{% if request.path == '/pvp/battle-calc/' %}active{% endif %}">PVP计算器</a></li>
            <li><a href="/pvp/damage-calc/" class="{% if request.path == '/pvp/damage-calc/' %}active{% endif %}">伤害计算器</a></li>
            <li><a href="/pets/" class="{% if '/pets/' in request.path %}active{% endif %}">精灵图鉴</a></li>
            <li><a href="/skills/" class="{% if '/skills/' in request.path %}active{% endif %}">技能图鉴</a></li>
            <li><a href="/items/" class="{% if '/items/' in request.path %}active{% endif %}">物品图鉴</a></li>
            <li><a href="/type-calc/" class="{% if '/type-calc/' in request.path %}active{% endif %}">克制计算器</a></li>
            <li><a href="/eggs/hatch/" class="{% if '/eggs/' in request.path %}active{% endif %}">孵蛋查询</a></li>
            {% comment %} <li><a href="/eggs/market/">交换市场</a></li> {% endcomment %}
            <li><a href="/articles/" class="{% if '/articles/' in request.path %}active{% endif %}">资讯</a></li>
        </ul>
        <div class="nav-actions">
            {% comment %} <!-- 登录注册暂关 -->
            <div class="nav-auth">
                {% if user.is_authenticated %}
                    <span class="nav-user">{{ user.username }}</span>
                    <a href="{% url 'logout' %}">登出</a>
                {% else %}
                    <a href="{% url 'login' %}">登录</a>
                    <a href="{% url 'register' %}">注册</a>
                {% endif %}
            </div>
            {% endcomment %}
            <button class="icon-btn theme-toggle" type="button" title="切换明暗主题" aria-label="切换明暗主题">
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                </svg>
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <button class="icon-btn nav-toggle" type="button" title="打开菜单" aria-label="打开菜单">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>
</nav>
