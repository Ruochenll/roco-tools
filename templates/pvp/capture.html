{% extends 'base.html' %}
{% load static %}
{% block title %}PVP 截图识别 - 洛克王国世界工具合集{% endblock %}

{% block content %}
<div style="max-width:760px;margin:0 auto;">
    <div class="tool-header">
        <h1>PVP 截图识别</h1>
        <p class="tool-sub">上传对方阵容截图，自动识别 6 只精灵并查询 BWIKI 数据</p>
    </div>

    <form method="POST" enctype="multipart/form-data" action="/pvp/capture/analyze/">
        {% csrf_token %}
        <label class="upload-zone" id="drop-zone">
            <div class="up-icon">📸</div>
            <div class="up-text">点击或拖拽上传 PVP 阵容截图</div>
            <div class="up-hint">支持 PNG / JPG / BMP</div>
            <input type="file" name="screenshot" accept="image/*" id="file-input" required>
        </label>
        <img id="preview" class="upload-preview" src="" alt="预览">
        <div id="status" class="text-center text-light mt-8" style="font-size:0.85rem;"></div>
        <div class="text-center mt-12">
            <button type="submit" class="btn btn-primary" id="submit-btn" disabled>开始识别</button>
        </div>
    </form>

    {% if error %}
    <div class="text-center mt-16" style="color:var(--color-error);">{{ error }}</div>
    {% endif %}
</div>
{% endblock %}

{% block extra_js %}
<script>
var input = document.getElementById('file-input');
var preview = document.getElementById('preview');
var drop = document.getElementById('drop-zone');
var btn = document.getElementById('submit-btn');
var statusDiv = document.getElementById('status');

input.addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        btn.disabled = false;
        statusDiv.textContent = file.name + ' (' + (file.size / 1024).toFixed(0) + ' KB)';
    }
});

drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('dragover'); });
drop.addEventListener('dragleave', function () { drop.classList.remove('dragover'); });
drop.addEventListener('drop', function (e) {
    e.preventDefault();
    drop.classList.remove('dragover');
    input.files = e.dataTransfer.files;
    input.dispatchEvent(new Event('change'));
});
</script>
{% endblock %}
