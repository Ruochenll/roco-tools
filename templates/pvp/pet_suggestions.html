{% load static %}
<!-- 属性图标筛选:点击筛选,再点当前属性取消 -->
<div class="suggest-filter">
    {% for elem in all_elements %}
    <span class="element-icon {% if elem.name == active_element %}active{% endif %}"
          title="{{ elem.name }}{% if elem.name == active_element %}(点击取消筛选){% endif %}"
          style="--element-current: var(--element-{{ elem.name }});"
          {% if elem.name == active_element %}
          hx-get="/pvp/pet-search/?search={{ query|urlencode }}"
          {% else %}
          hx-get="/pvp/pet-search/?element={{ elem.name|urlencode }}&search={{ query|urlencode }}"
          {% endif %}
          hx-target="closest .suggest-box"
          hx-trigger="click"
          hx-swap="innerHTML">
        <img src="{% static 'images/elements/'|add:elem.icon %}" alt="{{ elem.name }}">
    </span>
    {% endfor %}
    {% if active_element %}
    <span class="suggest-chip clear"
          hx-get="/pvp/pet-search/?search={{ query|urlencode }}"
          hx-target="closest .suggest-box"
          hx-trigger="click"
          hx-swap="innerHTML">
        ✕ {{ active_element }}系
    </span>
    {% endif %}
</div>

<!-- 精灵列表 -->
{% if pets %}
<div class="suggest-grid">
    {% for pet in pets %}
    <div class="suggest-pet"
         data-pet-id="{{ pet.id }}"
         data-pet-name="{{ pet.name }}"
         data-pet-img="{% static 'images/pets/'|add:pet.image %}"
         data-pet-elems="{% for e in pet.elements.all %}<span class='element-badge' style='background-color:var(--element-{{ e.name }});'>{{ e.name }}</span>{% endfor %}"
         data-pet-stats="HP {{ pet.hp }} · 物攻 {{ pet.physical_attack }} · 魔攻 {{ pet.magical_attack }} · 物防 {{ pet.physical_defense }} · 魔防 {{ pet.magical_defense }} · 速度 {{ pet.speed }}">
        <img src="{% static 'images/pets/'|add:pet.image %}" alt="{{ pet.name }}" loading="lazy">
        <span>{{ pet.name }}</span>
    </div>
    {% endfor %}
</div>
{% elif active_element %}
<div class="suggest-none">该属性下暂无精灵数据</div>
{% elif query %}
<div class="suggest-none">未找到匹配精灵</div>
{% else %}
<div class="suggest-none">输入名称搜索，或点击属性图标筛选</div>
{% endif %}
