{% if pet %}
<div id="card-{{ field }}">
    <div class="statcard">
        <div class="statcard-head">
            <span class="sc-name">{{ pet.name }} · 面板值</span>
            <span class="sc-cond">Lv.60 · ★5 · 成长0 · 天分0~10</span>
        </div>
        <div class="statcard-grid">
            {% for key, label, value, talent in stats %}
            <div class="stat-cell">
                <span class="st-label">{{ label }}</span>
                <strong id="s-{{ field }}-{{ key }}" class="st-value {% if talent > 0 %}boosted{% endif %}">{{ value }}</strong>
                <input type="number" class="num-input" name="{{ field }}_{{ key }}_talent"
                       min="0" max="10" value="{{ talent }}"
                       title="{{ label }}天分 (0~10)"
                       onchange="reloadStatCard('{{ field }}')">
            </div>
            {% endfor %}
        </div>
        <div class="nature-row">
            <span>性格：</span>
            <select name="{{ field }}_nature_up" class="select-input" onchange="reloadStatCard('{{ field }}')">
                <option value="-">-- 加成 +10% --</option>
                {% for key, label, _, _ in stats %}
                <option value="{{ key }}" {% if key == nature_up %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <span class="nature-up-mark">↑</span>
            <select name="{{ field }}_nature_down" class="select-input" onchange="reloadStatCard('{{ field }}')">
                <option value="-">-- 削弱 -10% --</option>
                {% for key, label, _, _ in stats %}
                <option value="{{ key }}" {% if key == nature_down %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <span class="nature-down-mark">↓</span>
        </div>
    </div>
</div>
{% endif %}
