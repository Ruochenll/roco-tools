{% if skills %}
<div class="skills-panel">
    <div class="skills-panel-title">选择技能（最多 4 个）</div>
    {% for i in "1234"|make_list %}
    <div class="skill-slot-row">
        <div class="skill-slot-main">
            <span class="sk-idx">{{ forloop.counter }}</span>
            <select name="{{ field }}_skill_{{ forloop.counter }}"
                    class="skill-select select-input"
                    onchange="recalcDamages()">
                <option value="">-- 空 --</option>
                {% for s in skills %}
                <option value="{{ s.id }}"
                        data-power="{{ s.power }}"
                        data-category="{{ s.category }}">
                    {{ s.name }} {% if s.power > 0 %}[{{ s.power }} {{ s.category }}]{% else %}[{{ s.category }}]{% endif %} {{ s.element }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="skill-slot-adjust">
            <label>威力+ <input type="number" class="num-input" name="{{ field }}_skill_{{ forloop.counter }}_pbonus" value="0" onchange="recalcDamages()"></label>
            <label>威力× <input type="number" class="num-input" name="{{ field }}_skill_{{ forloop.counter }}_pmul" value="1" step="0.1" onchange="recalcDamages()"></label>
            <label>连击 <input type="number" class="num-input" name="{{ field }}_skill_{{ forloop.counter }}_combo" value="1" min="1" onchange="recalcDamages()"></label>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
